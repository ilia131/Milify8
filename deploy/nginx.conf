server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name milify.ir admin.milify.ir artist.milify.ir api.milify.ir;
    return 308 https://$host$request_uri;
}

ssl_certificate /etc/nginx/tls/fullchain.pem;
ssl_certificate_key /etc/nginx/tls/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_http_version 1.1;

server {
    listen 443 ssl default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl;
    server_name milify.ir;
    location / { proxy_pass http://milify-web:3000; }
}

server {
    listen 443 ssl;
    server_name admin.milify.ir;
    client_max_body_size 128m;
    proxy_read_timeout 130s;
    location / { proxy_pass http://milify-admin:3000; }
}

server {
    listen 443 ssl;
    server_name artist.milify.ir;
    client_max_body_size 128m;
    proxy_read_timeout 130s;
    location / { proxy_pass http://milify-artist:3000; }
}

server {
    listen 443 ssl;
    server_name api.milify.ir;
    client_max_body_size 128m;
    proxy_read_timeout 130s;
    location / { proxy_pass http://backend:8000; }
}
